# Builds the banner page whenever the app uploads screenshots, a done list or corrections.
name: Banner page
on:
  push:
    branches: [main]
    paths: ['inbox/**', 'done.json', 'corrections.json', 'config.json', 'notes.json']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  page:
    # Not in the template itself: it has no Pages site (repos made from it are no templates)
    if: ${{ !github.event.repository.is_template }}
    uses: elkuku/KMyBanners-tool/.github/workflows/build-page.yml@v1
